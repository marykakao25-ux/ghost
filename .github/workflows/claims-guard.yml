name: claims-guard

# НАБЛЮДАТЕЛЬНЫЙ страж. Намеренно НЕ откатывает коммиты.
#
# Почему так: squash-merge обычного PR — это тоже push в main, затрагивающий
# код вне tasks/. Автоматический revert отменял бы любой смерженный PR.
# Поэтому здесь только предупреждение в лог и issue на прямые push в main
# от человека (PR-merge ботом нарушением не считается).
#
# Настоящая защита кода — agent-guard.yml на PR + Ruleset на main
# (block force-push / restrict deletions).
on:
  push:
    branches: [main]

permissions:
  contents: read
  issues: write

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Проверить содержимое push
        id: check
        run: |
          set -euo pipefail
          BEFORE="${{ github.event.before }}"
          echo "bad=" >> "$GITHUB_OUTPUT"
          echo "files=" >> "$GITHUB_OUTPUT"

          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "Новая ветка — проверять нечего."
            exit 0
          fi

          CHANGED=$(git diff --name-only "$BEFORE" "${{ github.sha }}")
          echo "Изменённые файлы:"; echo "$CHANGED"

          # tasks/** — разрешённый прямой push (лизы и статусы задач).
          # scripts/agent/** и .github/** — инфраструктура процесса: их пушат
          # сами скрипты агентов, предупреждать о них бессмысленно.
          BAD=$(echo "$CHANGED" | grep -vE '^(tasks/|scripts/agent/|\.github/)' | grep -v '^$' || true)
          if [ -z "$BAD" ]; then
            echo "Прямой push в main — только служебные пути, нарушений нет."
            exit 0
          fi

          echo "bad<<EOF" >> "$GITHUB_OUTPUT"
          echo "$BAD" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "files<<EOF" >> "$GITHUB_OUTPUT"
          echo "$CHANGED" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "::warning::Прямой push в main затронул файлы вне tasks/: $BAD. Ничего не откатываю."

      - name: Сообщить о нарушении (без отката)
        if: steps.check.outputs.bad != ''
        env:
          BAD: ${{ steps.check.outputs.bad }}
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail

          # PR-merge приходит от бота github-actions — это штатный путь.
          if [ "$ACTOR" = "github-actions[bot]" ]; then
            echo "Push от github-actions[bot] — это merge/бот, нарушением не считаем."
            exit 0
          fi

          BODY=$(printf 'Прямой push в `main` от `%s` затронул файлы вне `tasks/`:\n\n```\n%s\n```\n\nКоммит `%s` **не откатывался** (страж работает в наблюдательном режиме).\n\n**Как правильно:** изменения кода, сцен и ассетов — через задачу и PR:\n\n1. `pwsh -File scripts/agent/claim.ps1 -Task T-XXXX -Owner <имя>`\n2. работа в ветке `task/T-XXXX-*`\n3. PR с названием `[T-XXXX] ...`\n\nСм. `AGENTS.md`, раздел 3.\n' "$ACTOR" "$BAD" "$SHA")

          # Без поля labels: метки process в репозитории нет, GitHub вернул бы 422.
          curl -sS -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "${{ github.api_url }}/repos/${{ github.repository }}/issues" \
            -d "$(jq -n --arg t "claims-guard: прямой push в main ($SHA)" --arg b "$BODY" '{title:$t, body:$b}')"
